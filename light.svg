<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="title desc">
  <title id="title">Hazel Hidayah animated profile banner for light mode</title>
  <desc id="desc">An editorial animated banner introducing Hazel as a coder, designer, and storyteller.</desc>
  <defs>
    <clipPath id="frame">
      <rect width="900" height="380" rx="18"/>
    </clipPath>
    <filter id="lineArt" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0 0 0 0 0.094  0 0 0 0 0.094  0 0 0 0 0.090  -0.2126 -0.7152 -0.0722 0 1" result="ink"/>
      <feComposite in="ink" in2="SourceAlpha" operator="in"/>
    </filter>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="380" fill="#ffffff"/>

    <g fill="none" stroke="#d0d7de" stroke-width="1" opacity="0.65">
      <path d="M0 48H900M0 96H900M0 144H900M0 192H900M0 240H900M0 288H900M0 336H900"/>
      <path d="M90 0V380M180 0V380M270 0V380M360 0V380M450 0V380M540 0V380M630 0V380M720 0V380M810 0V380"/>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0 2;0 -2;0 2" dur="4s" repeatCount="indefinite"/>
      <image href="profile-character.png" x="642" y="20" width="222" height="222" preserveAspectRatio="xMidYMid meet" filter="url(#lineArt)"/>
    </g>

    <g transform="translate(54 48)">
      <text x="0" y="0" fill="#b63c32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="3">HELLO, I&apos;M</text>
      <text x="0" y="68" fill="#181817" font-family="Georgia, Times New Roman, serif" font-size="64" font-weight="600" letter-spacing="-2">Hazel Hidayah.</text>

      <g transform="translate(2 103)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="2">
        <text fill="#3f3b36">CODER
          <animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;0.28;0.34;0.61;0.67;0.94;1" dur="6s" repeatCount="indefinite" calcMode="discrete"/>
        </text>
        <text fill="#3f3b36" opacity="0">DESIGNER
          <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.28;0.34;0.61;0.67;0.94;1" dur="6s" repeatCount="indefinite" calcMode="discrete"/>
        </text>
        <text fill="#3f3b36" opacity="0">STORYTELLER
          <animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;0.28;0.34;0.61;0.67;0.94;1" dur="6s" repeatCount="indefinite" calcMode="discrete"/>
        </text>
        <rect x="58" y="-13" width="2" height="17" fill="#b63c32">
          <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
          <animate attributeName="x" values="58;58;92;92;116;116" keyTimes="0;0.28;0.34;0.61;0.67;1" dur="6s" repeatCount="indefinite" calcMode="discrete"/>
        </rect>
      </g>

      <text x="0" y="148" fill="#68645e" font-family="Trebuchet MS, Avenir Next, sans-serif" font-size="15">Building thoughtful digital experiences with code, design, and curiosity.</text>
      <rect x="0" y="166" width="350" height="2" rx="1" fill="#d8d2c7"/>
      <rect x="0" y="166" width="0" height="2" rx="1" fill="#c8281e">
        <animate attributeName="width" values="0;350;350;0" keyTimes="0;0.45;0.85;1" dur="6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <line x1="54" y1="244" x2="846" y2="244" stroke="#d0d7de" stroke-width="1"/>
    <g transform="translate(54 273)" fill="#3f3b36" font-family="Trebuchet MS, Avenir Next, sans-serif" font-size="14">
      <text x="0" y="0">I&apos;m a Computer Science student at NUS. I used to study Mass Communication at Ngee Ann Polytechnic,</text>
      <text x="0" y="24">so most of my time now has been dedicated to beating imposter syndrome! I find anything design &amp;</text>
      <text x="0" y="48">computer related <tspan font-style="italic">fascinating</tspan> so I dedicate my life to learning everything I can and nerding out about it :)</text>
      <text x="0" y="84" fill="#b63c32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1">Thanks for stopping by xoxo 🖤</text>
    </g>
  </g>
</svg>
